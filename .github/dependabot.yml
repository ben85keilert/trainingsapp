# Dependabot: Versionsupdates für die Actions in den Workflows — wöchentlich, gebündelt.
#
# Die Python-Abhängigkeiten (uv.lock) hebt der Workflow „uv-Updates“
# (.github/workflows/uv-updates.yml): Dependabots uv-Lauf scheiterte hier jedes Mal an den
# Schwesterordnern ../hrv-core und ../hrv-watch („path based dependencies could not be
# retrieved“), auch bei Sicherheitsupdates (Durchsicht 10.11.2026, N122). Die Meldungen
# unter „Security → Dependabot“ gibt es weiter. Erklärung: docs/dependabot.md.
#
# Kein `pub`-Ökosystem für die Dart-Seite der Erweiterungen (erweiterungen/*/src/
# flutter/*/pubspec.yaml) — bewusst (Ben, 16.10.2026): flutter_blue_plus darf wegen
# seiner Lizenz nie über 1.36.8, Dart-flet bleibt im Gleichschritt mit Python-flet,
# und `flet build` löst die Bereiche ohnehin bei jedem Build neu auf. Begründung und
# Vorlage für später: docs/dependabot.md, „Dart-Pakete (pub)“.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Ein PR für alle Actions statt einer je Action
    groups:
      actions:
        patterns: ["*"]

name: APK

# Baut eine Android-APK zum Herunterladen — mit denselben Schritten wie lokal
# (`uv run python scripts/apk_bauen.py`).
#
# - Von Hand: Reiter „Actions" → „APK" → „Run workflow". Die APK liegt danach
#   als Artefakt „trainingsapp-apk" am Lauf (Download nur mit GitHub-Anmeldung,
#   als ZIP, 30 Tage aufbewahrt).
# - Mit einem Tag `v*` (z. B. `git tag v0.1.0 && git push origin v0.1.0`):
#   zusätzlich ein Release, dessen APK sich direkt am Handy laden lässt.
#
# Signiert wird mit dem festen Schlüssel aus den Repository-Secrets
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD und ANDROID_KEY_ALIAS
# (anlegen mit `scripts/signierschluessel.py`). Nur mit demselben Schlüssel lässt
# sich ein Update über die installierte App spielen, ohne ihre Daten zu verlieren.
# Fehlen die Secrets, entsteht eine Debug-APK (Dateiname endet auf -debug).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # nur für das Release beim Tag

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Die Repos nebeneinander wie auf dem Entwicklungsrechner: `flet build` nimmt
    # hrv-core aus ../hrv-core und flet_medien aus ../hrv-watch ([tool.flet.dev_packages]).
    defaults:
      run:
        working-directory: trainingsapp

    steps:
      - name: Platz schaffen
        # Läuft vor dem Checkout — den Projektordner gibt es noch nicht, darum
        # ausdrücklich im Workspace statt im `defaults.run.working-directory`.
        working-directory: ${{ github.workspace }}
        # Der Build (Flutter, NDK, Gradle, R8) braucht mehr als die ~14 GB, die
        # der Runner frei hat — der erste Probelauf scheiterte an R8 mit
        # „No space left on device". Das Android SDK unter /usr/local/lib/android
        # bleibt, es wird gebraucht.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift \
            /usr/local/lib/node_modules /opt/microsoft /opt/google/chrome
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trainingsapp
          fetch-depth: 0 # Build-Nummer = Zahl der Commits
          # Das Token (contents: write) bleibt nicht in .git/config liegen, während
          # `flet build` fremden Gradle- und pub-Code ausführt (S28)
          persist-credentials: false

      - name: hrv-core-Stand aus hrv-core.ref lesen
        # Die Datei pinnt den Commit der Schwesterbibliothek (CLAUDE.md, „Die
        # HRV-Bibliothek hrv-core“). Dependabot hebt sie nicht — das geschieht
        # bewusst von Hand, wenn die App einen neueren Stand braucht.
        id: hrv_core
        working-directory: ${{ github.workspace }}
        run: |
          ref="$(tr -d '[:space:]' < trainingsapp/hrv-core.ref)"
          # wie in ci.yml: nur ein voller Commit-SHA, nie ein Zweig oder Tag (S28, N129)
          if ! printf '%s' "$ref" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error file=hrv-core.ref::hrv-core.ref muss genau einen vollen Commit-SHA (40 Hex-Zeichen) enthalten, gefunden: '$ref'"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: hrv-core (gemeinsame HRV-Bibliothek) auschecken
        # Öffentliches Repo (AGPL-3.0) — kein eigenes Token nötig.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ben85keilert/hrv-core
          ref: ${{ steps.hrv_core.outputs.ref }}
          path: hrv-core
          persist-credentials: false

      - name: hrv-watch-Stand aus hrv-watch.ref lesen
        # Schwesterrepo hrv-watch: Flet-Erweiterung flet_medien (Uhr am Handgelenk),
        # `flet build` nimmt sie aus ../hrv-watch/flet_medien ([tool.flet.dev_packages]).
        id: hrv_watch
        working-directory: ${{ github.workspace }}
        run: |
          ref="$(tr -d '[:space:]' < trainingsapp/hrv-watch.ref)"
          # wie in ci.yml: nur ein voller Commit-SHA, nie ein Zweig oder Tag (S28, N129)
          if ! printf '%s' "$ref" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error file=hrv-watch.ref::hrv-watch.ref muss genau einen vollen Commit-SHA (40 Hex-Zeichen) enthalten, gefunden: '$ref'"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: hrv-watch (Uhranbindung, flet_medien) auschecken
        # Öffentliches Repo — kein eigenes Token nötig.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ben85keilert/hrv-watch
          ref: ${{ steps.hrv_watch.outputs.ref }}
          path: hrv-watch
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Abhängigkeiten installieren
        # --locked: genau der Stand aus uv.lock, sonst bräche der Build ab (S28, N129)
        run: uv sync --locked

      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Kein Signierschlüssel in den Secrets — es entsteht eine Debug-APK."
            echo "APK_OPTIONEN=--debug" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/upload-keystore.jks"
            echo "FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FLET_ANDROID_SIGNING_KEY_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FLET_ANDROID_SIGNING_KEY_ALIAS=${KEY_ALIAS:-upload}"
          } >> "$GITHUB_ENV"

      - name: Flet-Version lesen
        id: flet
        run: |
          version="$(uv run python -c 'import flet.version; print(flet.version.flet_version)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Flet-Vorlage aus dem Cache
        # Die Build-Vorlage (`flet-build-template.zip`) lag am 8.11.2026 dreimal hinter einem
        # „504 Gateway Time-out“ von github.com/…/releases/download — darum liegt sie je
        # Flet-Version im Cache und kommt sonst über die GitHub-API (`gh release download`,
        # anderer Weg als der Browser-Link), mit Wiederholungen. `scripts/apk_bauen.py` nimmt
        # sie über TRAININGSAPP_VORLAGE_ZIP und lädt nur ohne sie selbst.
        id: vorlage_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/flet-vorlage
          key: flet-build-template-${{ steps.flet.outputs.version }}

      - name: Flet-Vorlage über die GitHub-API laden
        if: steps.vorlage_cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          FLET_VERSION: ${{ steps.flet.outputs.version }}
        run: |
          mkdir -p flet-vorlage
          for anlauf in 1 2 3 4 5 6; do
            if gh release download "v$FLET_VERSION" -R flet-dev/flet \
                 -p flet-build-template.zip -D flet-vorlage --clobber; then
              break
            fi
            echo "Anlauf $anlauf fehlgeschlagen — warte 45 s"
            sleep 45
          done
          ls -l flet-vorlage || true

      - name: Flet-Vorlage dem Build geben
        working-directory: ${{ github.workspace }}
        run: |
          if [ -s flet-vorlage/flet-build-template.zip ]; then
            echo "TRAININGSAPP_VORLAGE_ZIP=$GITHUB_WORKSPACE/flet-vorlage/flet-build-template.zip" >> "$GITHUB_ENV"
          else
            echo "::warning::Keine Vorlage vorab — das Skript lädt sie selbst (mit Wiederholungen)."
          fi

      - name: APK bauen
        # Flutter lädt `flet build` beim ersten Lauf selbst (--yes im Skript).
        run: uv run python scripts/apk_bauen.py $APK_OPTIONEN

      - name: Schlüssel entfernen
        if: always()
        working-directory: ${{ github.workspace }} # auch, wenn der Checkout fehlschlug
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trainingsapp-apk
          path: trainingsapp/dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: trainingsapp/dist/*.apk
          prerelease: true

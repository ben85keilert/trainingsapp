name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    # Beide Repos nebeneinander wie auf dem Entwicklungsrechner: pyproject.toml
    # bindet hrv-core als Schwesterordner ../hrv-core ein.
    defaults:
      run:
        working-directory: trainingsapp

    steps:
      - uses: actions/checkout@v7
        with:
          path: trainingsapp

      - name: hrv-core (gemeinsame HRV-Bibliothek) auschecken
        # Öffentliches Repo (AGPL-3.0) — kein eigenes Token nötig.
        uses: actions/checkout@v7
        with:
          repository: ben85keilert/hrv-core
          path: hrv-core

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Abhängigkeiten installieren
        # Nur was ohne Bildschirm gebraucht wird. flet selbst ist für die Tests
        # nicht nötig — genau das ist der Sinn der Importregel. `--only-group ci`
        # installiert auch das Paket selbst nicht, daher PYTHONPATH=src unten.
        run: uv sync --only-group ci

      - name: Linter
        run: uv run --no-sync ruff check .

      - name: Formatierung
        run: uv run --no-sync ruff format --check .

      - name: Tests
        run: uv run --no-sync pytest -q
        env:
          PYTHONPATH: src

      - name: Doctests
        run: |
          uv run --no-sync pytest --doctest-modules -q \
            src/trainingsapp/core \
            src/trainingsapp/devices \
            src/trainingsapp/config.py
        env:
          PYTHONPATH: src

      - name: Beispiele des Lernpfads
        # Wenn ein Beispiel nicht mehr läuft, ist der Lernpfad kaputt —
        # und das soll auffallen, bevor jemand daran sitzt.
        run: |
          for f in docs/tutorial/L01_werkzeuge/beispiel_03.py \
                   docs/tutorial/L02b_aufs_handy/pruefe_ble.py \
                   docs/tutorial/L04_daten_und_sqlite/beispiel_01.py \
                   docs/tutorial/L04_daten_und_sqlite/beispiel_02.py \
                   docs/tutorial/L04_daten_und_sqlite/beispiel_03.py \
                   docs/tutorial/L05_uebungskatalog/beispiel_01.py \
                   docs/tutorial/L05_uebungskatalog/beispiel_02.py \
                   docs/tutorial/L06_flexible_notation/beispiel_01.py \
                   docs/tutorial/L06_flexible_notation/beispiel_03.py \
                   docs/tutorial/Z_grundlagen/beispiel_asyncio.py; do
            echo "--- $f"
            uv run --no-sync python "$f" > /dev/null
          done
        env:
          PYTHONPATH: src

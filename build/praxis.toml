# Build-Profil: Edition B — Anbindung an die Praxisdatenbank.
#
#   flet build apk --template-data build/praxis.toml
#
# ACHTUNG: Vor der Auslieferung müssen die Dokumente in docs/recht/ ausgefüllt
# und geprüft sein — insbesondere 00_zweckbestimmung.md, 30_avv.md und
# 50_dsfa.md. Ohne unterzeichneten Auftragsverarbeitungsvertrag darf kein
# Patientendatensatz auf den Server.

[app]
edition = "praxis"
name = "Trainingsassistent Praxis"
description = "Übungen und Trainingsverlauf gemeinsam mit deiner Praxis"
bundle_id = "de.praxisebert.trainingsassistent.praxis"

[android]
permissions = [
    "android.permission.BLUETOOTH_SCAN",
    "android.permission.BLUETOOTH_CONNECT",
    "android.permission.INTERNET",
    "android.permission.POST_NOTIFICATIONS",
    # Fotos und Videos an Einträgen (seit 19.10.2026) — Aufnahmen bleiben auf dem Gerät,
    # gehen nicht in den Sync (docs/plan_anhaenge.md, G5)
    "android.permission.CAMERA",
    "android.permission.RECORD_AUDIO",
]

[ios]
bluetooth_usage = "Zum Verbinden mit deinem Herzfrequenzsensor während des Trainings."
camera_usage = "Fotos und Videos deiner Übungsausführung aufnehmen — sie bleiben auf diesem Gerät."
microphone_usage = "Ton für Videos deiner Übungsausführung — sie bleiben auf diesem Gerät."

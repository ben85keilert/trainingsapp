# Build-Profil: Edition A — autark, alles bleibt auf dem Gerät.
#
#   flet build apk --template-data build/solo.toml
#
# Kein Netzwerkpfad für eigene Daten, keine Serververbindung. Nach außen gehen nur,
# abschaltbar und mit Hinweis: Kartenkacheln (OpenStreetMap), Update-Prüfung
# (GitHub-Releases, Paketquellen — nur Versionsnummern) und verlinkte Videos.

[app]
edition = "solo"
name = "Trainingsassistent"
description = "Bewegungsübungen dokumentieren, mit begleitender HRV-Messung"
bundle_id = "de.praxisebert.trainingsassistent"

[android]
permissions = [
    "android.permission.BLUETOOTH_SCAN",
    "android.permission.BLUETOOTH_CONNECT",
]
# INTERNET wird in dieser Edition für Erklärvideos, Kartenkacheln und die
# Update-Prüfung gebraucht. Wer das nicht braucht, kann die Berechtigung entfernen.

[ios]
bluetooth_usage = "Zum Verbinden mit deinem Herzfrequenzsensor während des Trainings."

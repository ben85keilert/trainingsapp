# Build-Profil: Edition A — autark, alles bleibt auf dem Gerät.
#
#   flet build apk --template-data build/solo.toml
#
# Kein Netzwerkpfad für eigene Daten, keine Serververbindung. Nach außen gehen nur,
# abschaltbar und mit Hinweis: Kartenkacheln (OpenStreetMap), Update-Prüfung
# (GitHub-Releases, Paketquellen — nur Versionsnummern) und verlinkte Videos. Auf Tipp
# oder von selbst (Schalter, Vorgabe an: nur im WLAN, installiert, wenn die App eine Minute
# unbenutzt war) lädt die App das neuere Release (APK von GitHub) und installiert es selbst
# (erweiterungen/flet_installieren, seit 9.11.2026; die Berechtigungen bringt deren
# Manifest mit — für eine Fassung in Google Play die Erweiterung weglassen).
# Bilder in Kurskapiteln laden erst nach Einschalten (Einstellungen → Updates).
# Androids Geräte-Backup sichert nur, wenn es in den Einstellungen eingeschaltet ist
# (Vorgabe aus; GPS-Strecken gesondert) — BackupAgent `Sicherung`, scripts/apk_bauen.py.

[app]
edition = "solo"
name = "Trainingsassistent"
description = "Bewegungsübungen dokumentieren, mit begleitender HRV-Messung"
bundle_id = "de.praxisebert.trainingsassistent"

[android]
permissions = [
    "android.permission.BLUETOOTH_SCAN",
    "android.permission.BLUETOOTH_CONNECT",
    # Fotos, Videos (seit 19.10.2026) und Audioaufnahmen (seit 22.10.2026) — bleiben auf
    # dem Gerät
    "android.permission.CAMERA",
    "android.permission.RECORD_AUDIO",
]
# INTERNET wird in dieser Edition für Erklärvideos, Kartenkacheln und die
# Update-Prüfung gebraucht. Wer das nicht braucht, kann die Berechtigung entfernen.

[ios]
bluetooth_usage = "Zum Verbinden mit deinem Herzfrequenzsensor während des Trainings."
camera_usage = "Fotos und Videos deiner Übungsausführung aufnehmen — sie bleiben auf diesem Gerät."
microphone_usage = "Ton für Videos und Audioaufnahmen zu deinen Übungen und deinem Tag — sie bleiben auf diesem Gerät."

was = """Pakete laden im Browser (Ben, 23.11.2026, `docs/plan_web_pakete.md`): Das ganze Modul ist die Abzweigung — `ausfuehren` lässt eine Funktion des Kerns in der App im Thread über `urllib` laufen, im Browser (Pyodide, `im_pyodide`) mit vorab über `fetch` geholten Bytes (`vorab`); nur der eigene Server, Obergrenze, scrypt aus ``cryptography`` nachladen (`privat_bereit`). `PyodideNetz` gibt es nur dort."""

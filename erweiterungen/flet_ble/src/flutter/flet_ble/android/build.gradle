// Android-Teil von flet_ble: nur der Vordergrunddienst für Messungen im Hintergrund.
// Bewusst Java und Groovy wie flutter_blue_plus_android — kein Kotlin-Plugin, das
// zur AGP-Version der Flet-Vorlage passen müsste.
group 'de.praxisebert.flet_ble'
version '1.0'

apply plugin: 'com.android.library'

android {
    compileSdkVersion = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lintOptions {
        abortOnError false
    }

    defaultConfig {
        minSdkVersion 24
    }

    if (project.android.hasProperty("namespace")) {
        namespace 'de.praxisebert.flet_ble'
    }
}

[project]
name = "flet-installieren"
version = "0.1.0"
description = "Flet-Erweiterung: das eigene Update einer Android-App über den PackageInstaller installieren"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Praxis Ebert" }]
# Nur flet — Installieren ist Kotlin. Version im Gleichschritt mit der App.
dependencies = ["flet>=1.0.3"]

# Wie flet_hochladen: der Flutter-Teil landet im Wheel unter flutter/flet_installieren, wo
# serious_python beim `flet build` Erweiterungen sucht.
[tool.setuptools.package-data]
"flutter.flet_installieren" = ["**/*"]

[tool.setuptools]
license-files = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

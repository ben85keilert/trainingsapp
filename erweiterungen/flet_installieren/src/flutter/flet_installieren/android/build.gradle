// Android-Teil von flet_installieren: das eigene Update über den PackageInstaller.
// Aufbau wie flutter_image_compress_common 1.1.1: läuft mit AGP 8 (die App baut mit
// 8.11.1, Kotlin 2.2.20) und mit dem eingebauten Kotlin von AGP 9.
group 'de.praxisebert.flet_installieren'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinProperty = project.findProperty("android.builtInKotlin")
def builtInKotlinRequested = builtInKotlinProperty == null
        ? agpMajor >= 9
        : builtInKotlinProperty.toString().toBoolean()
def hasKotlinExtension = project.extensions.findByName("kotlin") != null
def useBuiltInKotlin = builtInKotlinRequested && hasKotlinExtension

if (!useBuiltInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    namespace 'de.praxisebert.flet_installieren'
    compileSdk 36

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (!useBuiltInKotlin) {
        kotlinOptions {
            jvmTarget = '17'
        }
    }
}

// Keine Abhängigkeiten außer Android selbst

if (useBuiltInKotlin) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}

name: flet_installieren
description: Flet-Service fürs eigene Update — eine geladene APK über den PackageInstaller von Android installieren
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flet: ^1.0.3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Ein Plugin mit Android-Teil: Installieren kann nur Kotlin (android/)
flutter:
  plugin:
    platforms:
      android:
        package: de.praxisebert.flet_installieren
        pluginClass: FletInstallierenPlugin

[project]
name = "trainingsapp"
version = "0.3.9"
description = "Trainingsassistent für Bewegungsübungen mit begleitender HRV-Messung"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

# Laufzeitabhängigkeiten bewusst minimal.
#
# numpy ist die einzige binäre Abhängigkeit — sie ist als vorgebautes Wheel für
# Android und iOS über pypi.flet.dev verfügbar. scipy ist es NICHT; deshalb
# implementiert hrv-core Welch, Lomb-Scargle, DFA und SampEn selbst in numpy.
#
# hrv-core ist die gemeinsame HRV-Bibliothek von praxis_gui und trainingsapp
# (github ben85keilert/hrv-core): Algorithmen, Korrektur und das Austauschformat
# raw-v1. Sie liegt als Schwesterordner ../hrv-core neben diesem Projekt — für uv
# über [tool.uv.sources], für `flet build` über [tool.flet.dev_packages]; die CI
# legt beide Repos nebeneinander ab (.github/workflows). Formeln und Regeln:
# hrv-core/docs/hrv_algorithmen.md und korrektur.md.
dependencies = [
    "flet==1.0.*",
    "flet-charts==1.0.*",
    "flet-video==1.0.*",
    "flet-permission-handler==1.0.*",
    # GPS-Tracking (docs/plan_gps.md): Karte (flutter_map, OSM-Kacheln) und Position
    "flet-map==1.0.*",
    "flet-geolocator==1.0.*",
    "numpy>=2.1",
    "hrv-core",
    # Eigene Flet-Erweiterungen im Repo: BLE auf Android über flutter_blue_plus
    # (erweiterungen/flet_ble) und Signaltöne des Timers, die Musik nur kurz
    # leiser machen statt sie anzuhalten (erweiterungen/flet_ton — flet-audio
    # nähme Musik-Apps den Audiofokus). Quelle für uv: [tool.uv.sources], für
    # `flet build`: [tool.flet.dev_packages]. Die CI (`uv sync --only-group ci`)
    # installiert Projektabhängigkeiten nicht und bleibt damit flet-frei.
    "flet-ble",
    "flet-ton",
    "flet-camera==1.0.*",
]

# Werkzeug fürs Inhalte-Repo: Paketdateien prüfen, bauen, Index schreiben
# (`uv run trainingsapp-paket …`, auch von außen: `uv run --project ../trainingsapp …`).
[project.scripts]
trainingsapp-paket = "trainingsapp.paket_werkzeug:main"

[project.optional-dependencies]
# Nur für die Desktop-Entwicklung: bleak funktioniert auf Windows/macOS/Linux,
# aber nicht in Flet-Android-Builds (serious_python statt python-for-android).
# Mobile BLE kommt über eine eigene Flet-Extension — siehe docs/architektur.md.
desktop = ["bleak>=0.22"]

# Entwicklungswerkzeuge als Dependency-Groups (PEP 735): `uv sync` installiert
# `dev` automatisch mit. Die Gruppe `ci` existiert, damit die CI mit
# `uv sync --only-group ci` testen kann, OHNE flet zu installieren — genau das
# ist der Sinn der Importregel (siehe .github/workflows/ci.yml).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]
# flet-cli liefert den `flet`-Befehl, flet-desktop den Desktop-Client für
# `flet run`. Eigene Gruppe statt Teil von `dev`, weil `ci` die Gruppe `dev`
# einschließt und flet-frei bleiben muss (flet-cli hängt von flet ab). In die
# App-Builds gehört ohnehin nur das schlanke `flet` aus den Laufzeitabhängigkeiten.
# flet-mcp ist der MCP-Server mit dem API-Index der installierten Flet-Version
# (`flet mcp`, eingetragen in .mcp.json) — er gibt KI-Assistenten die echte API
# statt veralteten Trainingswissens. Version immer im Gleichschritt mit flet.
flet-dev = [
    "flet-cli==1.0.*",
    "flet-desktop==1.0.*",
    "flet-mcp==1.0.*",
]
ci = [
    "numpy>=2.1",
    "hrv-core",
    { include-group = "dev" },
]

[tool.uv]
# `uv sync` ohne weitere Optionen ergibt eine vollständige Entwicklungsumgebung.
default-groups = ["dev", "flet-dev"]

[tool.uv.sources]
# Editierbar aus dem Repo — Änderungen am Python-Teil wirken ohne Neuinstallation.
flet-ble = { path = "erweiterungen/flet_ble", editable = true }
flet-ton = { path = "erweiterungen/flet_ton", editable = true }
# Schwesterrepo (siehe Kommentar bei `dependencies`); editierbar, damit eine Änderung
# an den Algorithmen hier sofort wirkt und beide Apps dieselben Zahlen liefern.
hrv-core = { path = "../hrv-core", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trainingsapp = ["data/migrations/*.sql", "data/seed/*.toml"]

# ---------------------------------------------------------------------------
# Flet-Build
# ---------------------------------------------------------------------------
# Die editionsspezifischen Werte (App-Name, Bundle-ID, Icon) stehen in
# build/solo.toml und build/praxis.toml und werden beim Bauen übergeben.
[tool.flet]
# Kein Bindestrich: der Wert wird zum Android-Paketnamen und muss ein gültiger
# Java-Bezeichner sein.
org = "de.praxisebert"
product = "Trainingsassistent"
company = "Praxis Ebert"
copyright = "Copyright (C) 2026 Benjamin Ebert"

# `flet build` packt genau dieses Verzeichnis in die App und startet dort `main.py`.
# Es muss `src` sein (nicht `src/trainingsapp/ui`), damit das Paket `trainingsapp`
# mitsamt Migrationen und Seed-Daten in die APK wandert — das Projekt selbst wird
# vom Build nicht als Abhängigkeit installiert.
[tool.flet.app]
path = "src"

[tool.flet.dev_packages]
# `flet build` nimmt Python- und Flutter-Teil der Erweiterung von hier (statt aus PyPI).
# Der Schlüssel muss wörtlich so heißen wie in `dependencies`; der Pfad ist relativ
# zum Projektordner.
flet-ble = "erweiterungen/flet_ble"
flet-ton = "erweiterungen/flet_ton"
# Auch außerhalb des Projektordners erlaubt: flet löst den Pfad relativ zum Projekt
# auf und übergibt ihn pip als file://-URL (flet_cli build_base, dev_packages).
hrv-core = "../hrv-core"

# Inline-Tabellen werden zu Attributen am <uses-permission> (android:<schlüssel>="…").
# - neverForLocation: Scan-Ergebnisse werden nicht zur Ortung benutzt. Ohne das Flag
#   filtert Android 12+ die Ergebnisse, solange keine Standortberechtigung erteilt ist.
# - Android ≤ 11 (API 30) kennt SCAN/CONNECT nicht: dort BLUETOOTH, BLUETOOTH_ADMIN
#   und Standort (seit dem GPS-Training für alle Versionen eingetragen, siehe unten). flet-permission-handler meldet `bluetoothScan` auf ≤ 11 nur dann
#   als erteilt, wenn BLUETOOTH im Manifest steht.
# Die Laufzeitabfrage übernimmt flutter_blue_plus beim ersten Scan bzw. Verbinden.
[tool.flet.android.permission]
"android.permission.BLUETOOTH_SCAN" = { usesPermissionFlags = "neverForLocation" }
"android.permission.BLUETOOTH_CONNECT" = true
"android.permission.BLUETOOTH" = { maxSdkVersion = 30 }
"android.permission.BLUETOOTH_ADMIN" = { maxSdkVersion = 30 }
# GPS-Training: Standort, solange die App sichtbar ist — im Hintergrund hält ihn der
# Vordergrunddienst vom Typ location (flet_ble/MessDienst); ACCESS_BACKGROUND_LOCATION
# braucht es dafür nicht (docs/plan_gps.md, Abschnitt 2).
"android.permission.ACCESS_FINE_LOCATION" = true
"android.permission.ACCESS_COARSE_LOCATION" = true
"android.permission.INTERNET" = true
# Fotos und Videos an Einträgen (docs/plan_anhaenge.md, seit 19.10.2026): Kamera in der
# App (flet-camera), Ton nur für Videos. Laufzeitabfrage beim ersten Aufnehmen; die
# Aufnahmen bleiben im app-privaten Speicher, ohne Ortsstempel, nie in Export oder Sync.
"android.permission.CAMERA" = true
"android.permission.RECORD_AUDIO" = true

# Geräte-Backup nur auf Wunsch (Sicherheitsdurchsicht S4; Ben, 20.10.2026): Androids
# Auto Backup sichert sonst Datenbank, Messungen und GPS-Strecken in Googles Cloud.
# Der Agent `Sicherung` (scripts/apk_bauen.py legt ihn in die Vorlage) schreibt nur,
# wenn die App die Marke aus core/sicherung.py gesetzt hat — Vorgabe aus.
[tool.flet.android.manifest_application]
backupAgent = ".Sicherung"
fullBackupOnly = "true"

[tool.flet.android.feature]
# BLE ist nötig für Messungen, aber kein Installationshindernis (required="false").
"android.hardware.bluetooth_le" = false
# Ohne Kamera läuft die App ebenso — nur Aufnehmen fehlt dann.
"android.hardware.camera" = false

# iOS: Begründungen in Info.plist (ohne sie lehnt Apple die App ab, `docs/recht/80_store_freigaben.md`).
[tool.flet.ios.info]
NSCameraUsageDescription = "Fotos und Videos deiner Übungsausführung aufnehmen — sie bleiben auf diesem Gerät."
NSMicrophoneUsageDescription = "Ton für Videos deiner Übungsausführung — sie bleiben auf diesem Gerät."

# Die Flet-Vorlage 1.0.3 zwingt jni auf 1.0.0; jni_flutter 1.0.4+1 (über
# path_provider_android 2.3.1) verlangt jni ^1.1.0 → „Constant evaluation error …
# expect package:jni ^1.1.0“ beim Build. 1.0.3 passt zu jni 1.0.0 (gleiche Abhilfe
# wie in praxis_mobil, 2026-10-06). Wegnehmen, sobald eine Flet-Vorlage jni ≥ 1.1 zulässt.
# Ebenso shared_preferences_android 2.5.0 (erschienen 17.10.2026, verlangt jni ^1.1.0 —
# der Tag v0.2.2 scheiterte daran); 2.4.28 kommt ohne jni aus.
[tool.flet.flutter.pubspec.dependency_overrides]
jni_flutter = "1.0.3"
shared_preferences_android = "2.4.28"

# ---------------------------------------------------------------------------
# Werkzeuge
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Markdown enthält Lehrbeispiele, deren Ausrichtung absichtlich so ist.
# ruff soll sie nicht umformatieren.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # deutsche Umlaute/Sonderzeichen in Strings sind gewollt
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
packages = ["trainingsapp"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

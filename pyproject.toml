[project]
name = "trainingsapp"
version = "0.1.0"
description = "Trainingsassistent für Bewegungsübungen mit begleitender HRV-Messung"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

# Laufzeitabhängigkeiten bewusst minimal.
#
# numpy ist die einzige binäre Abhängigkeit — sie ist als vorgebautes Wheel für
# Android und iOS über pypi.flet.dev verfügbar. scipy ist es NICHT; deshalb
# implementiert hrv_core/ Welch, Lomb-Scargle, DFA und SampEn selbst.
# Siehe docs/hrv_algorithmen.md.
dependencies = [
    "flet==1.0.*",
    "flet-charts==1.0.*",
    "flet-video==1.0.*",
    "flet-permission-handler==1.0.*",
    "numpy>=2.1",
]

[project.optional-dependencies]
# Nur für die Desktop-Entwicklung: bleak funktioniert auf Windows/macOS/Linux,
# aber nicht in Flet-Android-Builds (serious_python statt python-for-android).
# Mobile BLE kommt über eine eigene Flet-Extension — siehe docs/architektur.md.
desktop = ["bleak>=0.22"]

# Entwicklungswerkzeuge als Dependency-Groups (PEP 735): `uv sync` installiert
# `dev` automatisch mit. Die Gruppe `ci` existiert, damit die CI mit
# `uv sync --only-group ci` testen kann, OHNE flet zu installieren — genau das
# ist der Sinn der Importregel (siehe .github/workflows/ci.yml).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]
# flet-cli liefert den `flet`-Befehl, flet-desktop den Desktop-Client für
# `flet run`. Eigene Gruppe statt Teil von `dev`, weil `ci` die Gruppe `dev`
# einschließt und flet-frei bleiben muss (flet-cli hängt von flet ab). In die
# App-Builds gehört ohnehin nur das schlanke `flet` aus den Laufzeitabhängigkeiten.
# flet-mcp ist der MCP-Server mit dem API-Index der installierten Flet-Version
# (`flet mcp`, eingetragen in .mcp.json) — er gibt KI-Assistenten die echte API
# statt veralteten Trainingswissens. Version immer im Gleichschritt mit flet.
flet-dev = [
    "flet-cli==1.0.*",
    "flet-desktop==1.0.*",
    "flet-mcp==1.0.*",
]
ci = [
    "numpy>=2.1",
    { include-group = "dev" },
]

[tool.uv]
# `uv sync` ohne weitere Optionen ergibt eine vollständige Entwicklungsumgebung.
default-groups = ["dev", "flet-dev"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trainingsapp = ["data/migrations/*.sql", "data/seed/*.json"]

# ---------------------------------------------------------------------------
# Flet-Build
# ---------------------------------------------------------------------------
# Die editionsspezifischen Werte (App-Name, Bundle-ID, Icon) stehen in
# build/solo.toml und build/praxis.toml und werden beim Bauen übergeben.
[tool.flet]
# Kein Bindestrich: der Wert wird zum Android-Paketnamen und muss ein gültiger
# Java-Bezeichner sein.
org = "de.praxisebert"
product = "Trainingsassistent"
company = "Praxis Ebert"
copyright = "Copyright (C) 2026 Benjamin Ebert"

# `flet build` packt genau dieses Verzeichnis in die App und startet dort `main.py`.
# Es muss `src` sein (nicht `src/trainingsapp/ui`), damit das Paket `trainingsapp`
# mitsamt Migrationen und Seed-Daten in die APK wandert — das Projekt selbst wird
# vom Build nicht als Abhängigkeit installiert.
[tool.flet.app]
path = "src"

[tool.flet.android.permission]
"android.permission.BLUETOOTH_SCAN" = true
"android.permission.BLUETOOTH_CONNECT" = true
"android.permission.INTERNET" = true

# ---------------------------------------------------------------------------
# Werkzeuge
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Markdown enthält Lehrbeispiele, deren Ausrichtung absichtlich so ist.
# ruff soll sie nicht umformatieren.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # deutsche Umlaute/Sonderzeichen in Strings sind gewollt
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
packages = ["trainingsapp"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

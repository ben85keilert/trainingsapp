# Paket „Standard“ — die Übungen, die mit der App kommen.
#
# Eine Übung = ein [[exercises]]-Block. Abschnitte und Reihenfolge dienen nur der
# Übersicht. Die Felder sind dieselben wie im Austauschformat (JSON, siehe
# docs/uebungspakete.md) — hier nur als TOML, damit man Kommentare schreiben und
# schnell korrigieren kann.
#
# Pflegen
#   key          NIE ändern: Die ID der Übung folgt daraus. Ein neuer key ist eine
#                neue Übung, die alte bliebe auf allen Geräten stehen.
#                Nur a–z, 0–9 und _ (keine Umlaute).
#   alles andere darf man ändern.
#   Neue Übung   Block kopieren, neuen key vergeben — kommt beim nächsten Start dazu.
#   Änderungen   an vorhandenen Übungen kommen erst an, wenn paket.version steigt —
#                dann je Feld: Was jemand in der App geändert hat, bleibt
#                (docs/uebungspakete.md, „Update lässt Geändertes stehen“).
#   version      gleiche Version = gleicher Inhalt wie das veröffentlichte Paket.
#                Hat ein Gerät „Standard“ schon in höherer Version (Paketquelle),
#                lässt der Start es in Ruhe.
#   Prüfen       uv run pytest tests/test_pakete.py
#
# Felder je Übung
#   key, name    Pflicht
#   typen        Atmung, Entspannung, HRV, Mobilisation, Dehnung, Kräftigung,
#                Isometrie, Gleichgewicht, Ausdauer, Benchmark, Messung
#   regionen     Nacken, Schulter, Arm, Hand, Rumpf, Rücken, Hüfte, Bein, Fuß
#   spec         saetze_wdh (3x15, Vorgabe) · halten (3x30s) · wdh_oder_halten
#                · winkel (45°) · benchmark_zeit (62s)
#   icon_key     aus ui/components/icons.py (AUSWAHL)
#   description  ein, zwei Sätze: Ausgangsstellung und worauf es ankommt.
#                Einseitige Übungen enden mit „Je Seite.“
#   limit_spec   Timer: { rules = [{ type = "timer", seconds = 300 }] }
#   media        Videos: [{ uri = "https://…", title = "Erklärvideo" }]

format = "trainingsapp-uebungspaket"
version = 1

[paket]
# Die ID stammt aus dem früheren Namen „Grundausstattung“ — nie ändern, sonst
# stünde jede mitgelieferte Übung doppelt da.
id = "2c1194ea-67ba-536d-aa7d-bf74bc3c73d4"
name = "Standard"
beschreibung = "Die wichtigsten Übungen zum Einstieg: Atmung, Mobilisation, Dehnung, Kräftigung, Gleichgewicht und Messwerte zum Vergleichen."
version = 3
neuigkeiten = "Vier Messungen für die Herzfrequenz: Ruhe-HF morgens (10 min), Submaximaltest, Talk-Test und Feld-Maximaltest — mit Timer-Stufen, ausgewertet in der Herzfrequenz-Sicht."



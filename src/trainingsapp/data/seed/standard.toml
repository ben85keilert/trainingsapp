description = "Immer derselbe Weg, dasselbe Gerät. Drei Stufen mit gleichbleibender Herzfrequenz: Stufe 1 locker, Stufe 2 zügig, Stufe 3 hart, die Zielwerte stehen in der Herzfrequenz-Sicht. Nach Stufe 3 sofort stehen bleiben und 60 Sekunden ruhig stehen: Die Erholung in dieser Minute ist der Vergleichswert von Woche zu Woche."

[[exercises.timer]]
name = "Submaximaltest 6/6/3 + 1"

